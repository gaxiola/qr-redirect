<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; min-height: 100vh; margin: 0;
      align-items: center; justify-content: center;
      background: #fafafa; color: #222;
      padding: 1.5rem;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #eee; }
      a { color: #6cf; }
    }
    .card {
      max-width: 28rem; text-align: center;
      padding: 1.5rem 1.75rem;
      border-radius: 12px;
      background: rgba(127,127,127,.08);
    }
    h1 { font-size: 1.2rem; margin: 0 0 .5rem; }
    p  { margin: .35rem 0; line-height: 1.5; font-size: .95rem; }
    .muted { opacity: .65; font-size: .85rem; }
    a.button {
      display: inline-block; margin-top: .9rem;
      padding: .55rem 1.1rem; border-radius: 8px;
      background: #4a7afe; color: white; text-decoration: none;
      font-weight: 500;
    }
    code { background: rgba(127,127,127,.15); padding: 1px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1 id="title">Looking up link…</h1>
    <p id="msg" class="muted">One moment.</p>
    <p id="action"></p>
  </div>

  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      const id = (params.get("id") || "").trim();
      const card = document.getElementById("card");
      const title = document.getElementById("title");
      const msg = document.getElementById("msg");
      const action = document.getElementById("action");

      function fail(t, m, link) {
        title.textContent = t;
        msg.textContent = m;
        if (link) {
          action.innerHTML =
            '<a class="button" href="' + link.href + '">' + link.label + "</a>";
        }
      }

      if (!id) {
        fail(
          "No link ID provided",
          "Add ?id=your-link-id to the URL.",
          { href: "admin.html", label: "Open admin page" }
        );
        return;
      }

      let map;
      try {
        const res = await fetch("links.json?cb=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        map = await res.json();
      } catch (e) {
        fail("Could not load link map", String(e));
        return;
      }

      const target = map[id];
      if (!target) {
        fail(
          "Link not found",
          'No entry for "' + id + '" in links.json.',
          { href: "admin.html", label: "Open admin page" }
        );
        return;
      }

      title.textContent = "Redirecting…";
      msg.innerHTML = 'Sending you to <code>' + id + '</code>.';
      action.innerHTML =
        '<a class="button" href="' + target + '">Tap if not redirected</a>';
      // brief pause so the QR scanner has time to hand off cleanly
      setTimeout(function () { location.replace(target); }, 250);
    })();
  </script>
</body>
</html>
