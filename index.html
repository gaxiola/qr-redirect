<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafafa;
      --surface: #ffffff;
      --border: rgba(0,0,0,.08);
      --text: #18181b;
      --text-muted: rgba(24,24,27,.6);
      --accent: #4a7afe;
      --accent-text: #ffffff;
      --code-bg: rgba(0,0,0,.06);
      --shadow: 0 1px 3px rgba(0,0,0,.05), 0 6px 24px rgba(0,0,0,.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0e10;
        --surface: #18181b;
        --border: rgba(255,255,255,.08);
        --text: #f4f4f5;
        --text-muted: rgba(244,244,245,.6);
        --accent: #6c8eff;
        --accent-text: #0e0e10;
        --code-bg: rgba(255,255,255,.08);
        --shadow: 0 1px 3px rgba(0,0,0,.4);
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; min-height: 100vh; margin: 0;
      align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 28rem; text-align: center;
      padding: 1.75rem 1.75rem 1.5rem;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    h1 { font-size: 1.2rem; margin: 0 0 .5rem; font-weight: 600; }
    p  { margin: .35rem 0; line-height: 1.5; font-size: .95rem; }
    .muted { color: var(--text-muted); font-size: .85rem; }
    a.button {
      display: inline-block; margin-top: 1rem;
      padding: .6rem 1.15rem; border-radius: 8px;
      background: var(--accent); color: var(--accent-text);
      text-decoration: none; font-weight: 500;
    }
    a.button:hover { filter: brightness(1.08); }
    code {
      background: var(--code-bg); padding: 2px 7px; border-radius: 5px;
      font-size: .88em;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1 id="title">Looking up link…</h1>
    <p id="msg" class="muted">One moment.</p>
    <p id="action"></p>
  </div>

  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      const id = (params.get("id") || "").trim();
      const card = document.getElementById("card");
      const title = document.getElementById("title");
      const msg = document.getElementById("msg");
      const action = document.getElementById("action");

      function fail(t, m, link) {
        title.textContent = t;
        msg.textContent = m;
        if (link) {
          action.innerHTML =
            '<a class="button" href="' + link.href + '">' + link.label + "</a>";
        }
      }

      if (!id) {
        fail(
          "No link ID provided",
          "Add ?id=your-link-id to the URL.",
          { href: "admin.html", label: "Open admin page" }
        );
        return;
      }

      let map;
      try {
        const res = await fetch("links.json?cb=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        map = await res.json();
      } catch (e) {
        fail("Could not load link map", String(e));
        return;
      }

      const target = map[id];
      if (!target) {
        fail(
          "Link not found",
          'No entry for "' + id + '" in links.json.',
          { href: "admin.html", label: "Open admin page" }
        );
        return;
      }

      title.textContent = "Redirecting…";
      msg.innerHTML = 'Sending you to <code>' + id + '</code>.';
      action.innerHTML =
        '<a class="button" href="' + target + '">Tap if not redirected</a>';
      // brief pause so the QR scanner has time to hand off cleanly
      setTimeout(function () { location.replace(target); }, 250);
    })();
  </script>
</body>
</html>
